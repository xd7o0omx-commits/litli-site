<style>
  :root{
    --cream:#F4EFE7; --white:#FFFFFF; --ink:#191C1B;
    --olive:#385149; --olive-deep:#293C36;
    --clay:#C97F68; --clay-light:#D9A28E; --clay-dark:#B56F5A; --brown:#6E7269;
    --sky:#BFE1E8; --sky-deep:#5C93A0;
    --pink:#F3D0D6; --pink-deep:#C97F91;
    --line:rgba(25,28,27,.09); --ease:cubic-bezier(.28,.72,.28,1);
    --font-head:'Noto Kufi Arabic','Noto Sans Arabic',sans-serif;
    --font-body:'Almarai','Noto Sans Arabic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html{scroll-behavior:smooth;}
  body{font-family:var(--font-body);background:#FBF8F3;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}
  html[lang="en"] body{font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;color:var(--ink);letter-spacing:-.01em;}
  html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{
    font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);letter-spacing:-.02em;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  svg{display:block;}
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

  /* flat card surface — replaces the old glass/blur look to match the homepage identity */
  .glass{
    background:var(--white);
    border:1px solid var(--line);
    box-shadow:none;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .glass:hover{transform:translateY(-2px);box-shadow:0 14px 26px -18px rgba(25,28,27,.25);}

  header{background:var(--cream);border-bottom:none;box-shadow:0 1px 0 rgba(25,28,27,.09);position:sticky;top:0;z-index:50;}
  .nav-wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:60px;}
  .brand-mark{height:32px;}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .nav-icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--ink);background:transparent;border:none;transition:background .22s;}
  .nav-icon-btn:hover{background:rgba(25,28,27,.07);}
  .lang-switch{font-size:11.5px;font-weight:500;border-radius:100px;padding:6px 13px;display:flex;gap:4px;background:transparent;border:1px solid rgba(25,28,27,.2);}
  .lang-switch:hover{background:rgba(25,28,27,.06);}
  .lang-switch span{opacity:.45;}
  .lang-switch span.active{opacity:1;color:var(--olive);}

  .breadcrumb{max-width:1240px;margin:0 auto;padding:20px 24px 0;font-size:13px;color:var(--brown);display:flex;gap:8px;align-items:center;}
  .breadcrumb a:hover{color:var(--clay);}

  .cat-hero{max-width:1240px;margin:0 auto;padding:24px 24px 10px;display:flex;align-items:center;gap:22px;}
  .cat-icon-frame{width:88px;height:88px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .cat-icon-frame .icon{width:38px;height:38px;stroke:var(--olive);}
  .cat-hero h1{font-size:34px;margin-bottom:4px;}
  .cat-hero .sub{color:var(--brown);font-size:13.5px;}

  .section{max-width:1240px;margin:0 auto;padding:36px 24px 90px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:22px;}
  .product{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;}
  .product-media{aspect-ratio:1/1;position:relative;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card-photo{width:100%;height:100%;object-fit:cover;display:block;}
  .icon-badge{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .icon-badge .icon{width:42%;height:42%;stroke:var(--ink);stroke-width:1.3;opacity:.82;}
  .product-media .tag{position:absolute;top:10px;inset-inline-start:10px;background:var(--olive);color:#fff;font-size:10px;padding:4px 11px;border-radius:100px;z-index:2;}
  .product-info{padding:14px 14px 16px;display:flex;flex-direction:column;gap:5px;flex:1;}
  .product-info .cat{font-size:11.5px;color:var(--brown);}
  .product-info .name{font-weight:600;font-size:14.5px;}
  .price-row{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:9px;}
  .price{font-weight:700;font-size:15px;}
  .price .old{text-decoration:line-through;color:var(--brown);font-weight:400;font-size:12px;margin-inline-start:7px;}
  .add-btn{background:var(--clay);color:#fff;font-size:12px;font-weight:500;padding:8px 16px;border-radius:100px;transition:background .25s var(--ease);}
  .add-btn:hover{background:var(--clay-dark);}

  .empty-state{text-align:center;padding:70px 20px;color:var(--brown);}
  .empty-state h2{font-size:26px;margin-bottom:10px;}
  .empty-state a{display:inline-block;margin-top:18px;padding:12px 26px;border-radius:100px;background:var(--clay);color:#fff;font-weight:500;font-size:14px;transition:background .25s var(--ease);}
  .empty-state a:hover{background:var(--clay-dark);}

  footer{background:transparent;border-top:1px solid rgba(0,0,0,.07);padding:30px 24px;text-align:center;color:var(--brown);font-size:12.5px;font-weight:300;}

  @media(max-width:880px){
    .grid{grid-template-columns:repeat(2,1fr);}
    .cat-hero{flex-direction:column;align-items:flex-start;}
  }
</style>
</head>

function getCatKey(){
  const params = new URLSearchParams(window.location.search);
  return params.get('cat') || 'feeding';
}

function render(){
  const key = getCatKey();
  const cat = dict[currentLang].cats[key] || dict[currentLang].cats.feeding;
  document.getElementById('catTitle').textContent = cat.name;
  document.getElementById('catSub').textContent = cat.sub;
  document.getElementById('crumbCurrent').textContent = cat.name;
  document.getElementById('catIcon').innerHTML = `<use href="#${cat.icon}"/>`;

  const items = products.filter(p => p.need === key);
  const grid = document.getElementById('productGrid');
  const empty = document.getElementById('emptyState');

  if(items.length === 0){
    grid.style.display = 'none';
    empty.style.display = 'block';
  } else {
    grid.style.display = 'grid';
    empty.style.display = 'none';
    grid.innerHTML = items.map(p => `
      <div class="product" onclick="location.href='product.html?id=${p.id}'" style="cursor:pointer">
        <div class="product-media">
          ${p.tag ? `<span class="tag">${currentLang==='ar'?p.tag.ar:p.tag.en}</span>` : ''}
          ${heroPhotos[p.id] ? `<img class="card-photo" src="${heroPhotos[p.id]}" alt="">` : `<div class="icon-badge glass"><svg class="icon"><use href="#${p.icon}"/></svg></div>`}
        </div>
        <div class="product-info">
          <span class="cat">${currentLang==='ar'?p.arCat:p.enCat}</span>
          <span class="name">${currentLang==='ar'?p.ar:p.en}</span>
          <div class="price-row">
            <span class="price">${fmtPrice(p.price)} ${p.old?`<span class="old">${fmtPrice(p.old)}</span>`:''}</span>
            <button class="add-btn" onclick="event.stopPropagation(); location.href='product.html?id=${p.id}'">${dict[currentLang]['add']}</button>
          </div>
        </div>
      </div>`).join('');
  }
}

function applyLang(lang){
  currentLang = lang;
  const html = document.getElementById('htmlRoot');
  html.lang = lang; html.dir = lang==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[lang][k] !== undefined) el.textContent = dict[lang][k];
  });
  document.querySelectorAll('[data-lang-opt]').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-lang-opt') === lang);
  });
  render();
}
document.getElementById('langSwitch').addEventListener('click', ()=>{
  applyLang(currentLang === 'ar' ? 'en' : 'ar');
});

render();
</script>
