<!DOCTYPE html>
<html lang="ar" dir="rtl" id="htmlRoot">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Litli | المنتج</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Arabic:wght@300;400;500;600;700&family=Almarai:wght@300;400;700;800&family=Noto+Kufi+Arabic:wght@300;400;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#F4EFE7; --white:#FFFFFF; --ink:#191C1B;
    --olive:#385149; --olive-deep:#293C36;
    --clay:#C97F68; --clay-light:#D9A28E; --clay-dark:#B56F5A; --brown:#6E7269;
    --line:rgba(25,28,27,.09); --ease:cubic-bezier(.28,.72,.28,1);
    --ok:#3D6B4F;
    --font-head:'Noto Kufi Arabic','Noto Sans Arabic',sans-serif;
    --font-body:'Almarai','Noto Sans Arabic',sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:var(--font-body);background:#FBF8F3;color:var(--ink);line-height:1.65;-webkit-font-smoothing:antialiased;}
  html[lang="en"] body{font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:var(--font-head);font-weight:600;color:var(--ink);letter-spacing:-.01em;}
  html[lang="en"] h1,html[lang="en"] h2,html[lang="en"] h3{font-family:'Inter',sans-serif;font-weight:600;color:var(--ink);letter-spacing:-.02em;}
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;border:none;background:none;}
  svg{display:block;}
  .icon{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;}

  /* flat card surface — replaces the old glass/blur look to match the homepage identity */
  .glass{
    background:var(--white);
    border:1px solid var(--line);
    box-shadow:none;
    transition:transform .3s var(--ease), box-shadow .3s var(--ease);
  }
  .glass:hover{transform:translateY(-2px);box-shadow:0 14px 26px -18px rgba(25,28,27,.25);}

  header{background:var(--cream);border-bottom:none;box-shadow:0 1px 0 rgba(25,28,27,.09);position:sticky;top:0;z-index:50;}
  .nav-wrap{max-width:1180px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;padding:0 22px;height:60px;}
  .brand-mark{height:32px;}
  .nav-actions{display:flex;align-items:center;gap:10px;}
  .nav-icon-btn{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;position:relative;color:var(--ink);background:transparent;border:none;transition:background .22s;}
  .nav-icon-btn:hover{background:rgba(25,28,27,.07);}
  .badge{position:absolute;top:-3px;left:-3px;background:var(--ink);color:#fff;font-size:9.5px;font-weight:700;border-radius:50%;width:15px;height:15px;display:flex;align-items:center;justify-content:center;}
  html[lang="en"] .badge{left:auto;right:-3px;}
  .lang-switch{font-size:11.5px;font-weight:500;border-radius:100px;padding:6px 13px;display:flex;gap:4px;background:transparent;border:1px solid rgba(25,28,27,.2);}
  .lang-switch:hover{background:rgba(25,28,27,.06);}
  .lang-switch span{opacity:.45;} .lang-switch span.active{opacity:1;color:var(--olive);}

  .breadcrumb{max-width:1240px;margin:0 auto;padding:18px 24px 0;font-size:12.5px;color:var(--brown);display:flex;gap:7px;flex-wrap:wrap;}
  .breadcrumb a:hover{color:var(--clay);}

  /* ---- layout ---- */
  .pdp{max-width:1240px;margin:0 auto;padding:20px 24px 60px;display:grid;grid-template-columns:1.05fr .95fr;gap:46px;align-items:start;}

  /* ---- gallery ---- */
  .gallery{position:sticky;top:92px;}
  .stage{aspect-ratio:1/1;border-radius:20px;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center;padding:14px;
    background:linear-gradient(to top,#D9C4AC 0%,#F7F3EC 100%);}
  .stage-frame{width:100%;height:100%;border-radius:16px;overflow:hidden;position:relative;display:flex;align-items:center;justify-content:center;
    border:1px solid rgba(255,255,255,.6);
    box-shadow:0 24px 48px -22px rgba(25,28,27,.4), inset 0 1px 1px rgba(255,255,255,.85);
    background:var(--shot,linear-gradient(160deg,#EFE1D6,#D9A28E));}
  .stage-frame::after{content:"";position:absolute;inset:0;pointer-events:none;
    background:linear-gradient(155deg, rgba(255,255,255,.24) 0%, rgba(255,255,255,0) 32%, rgba(255,255,255,0) 76%, rgba(255,255,255,.12) 100%);}
  .stage-frame .icon{width:44%;height:44%;stroke:var(--ink);stroke-width:1;opacity:.85;filter:drop-shadow(0 10px 14px rgba(0,0,0,.16));transition:transform .6s var(--ease);}
  .stage:hover .stage-frame .icon{transform:scale(1.06) rotate(-2deg);}
  .stage-frame.has-photo{background:#EDE5DA;}
  .stage-frame img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .7s var(--ease);}
  .stage:hover .stage-frame img{transform:scale(1.05);}
  .thumb.has-photo{background:#EDE5DA;padding:0;}
  .thumb img{width:100%;height:100%;object-fit:cover;display:block;}
  .stage-tag{position:absolute;top:22px;inset-inline-start:22px;background:var(--olive);color:#fff;font-size:11px;padding:5px 13px;border-radius:100px;z-index:3;}
  .shot-note{position:absolute;bottom:22px;inset-inline-start:22px;font-size:11px;padding:6px 13px;border-radius:100px;z-index:3;color:var(--brown);}

  .thumbs{display:flex;gap:10px;margin-top:12px;overflow-x:auto;padding-bottom:4px;scroll-snap-type:x mandatory;}
  .thumb{width:74px;height:74px;flex-shrink:0;border-radius:14px;overflow:hidden;border:1.5px solid var(--line);
    display:flex;align-items:center;justify-content:center;background:var(--shot,#EFE1D6);scroll-snap-align:start;transition:border-color .25s var(--ease);}
  .thumb.active{border-color:var(--clay);}
  .thumb .icon{width:40%;height:40%;stroke:var(--ink);stroke-width:1.2;opacity:.75;}

  /* ---- info ---- */
  .info .cat{font-size:12px;color:var(--brown);letter-spacing:1px;text-transform:uppercase;}
  .info h1{font-size:34px;line-height:1.3;margin:6px 0 10px;}
  .rating{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--brown);margin-bottom:16px;}
  .stars{display:flex;gap:2px;}
  .stars .icon{width:15px;height:15px;stroke:var(--clay);fill:var(--clay);}
  .stars .icon.empty{fill:none;opacity:.4;}

  .price-block{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;}
  .price-now{font-size:26px;font-weight:700;}
  .price-old{font-size:15px;color:var(--brown);text-decoration:line-through;}
  .save-chip{background:rgba(201,127,104,.15);color:var(--clay);font-size:11.5px;padding:3px 11px;border-radius:100px;font-weight:600;}
  .vat-note{font-size:11.5px;color:var(--brown);margin-bottom:20px;}

  .divider{height:1px;background:var(--line);margin:20px 0;}

  .opt-label{font-size:13px;font-weight:600;margin-bottom:9px;display:flex;gap:7px;align-items:center;}
  .opt-label .val{color:var(--brown);font-weight:400;}
  .swatches{display:flex;gap:9px;margin-bottom:20px;}
  .swatch{width:36px;height:36px;border-radius:50%;border:2px solid transparent;box-shadow:inset 0 0 0 1px rgba(0,0,0,.1);cursor:pointer;transition:transform .25s var(--ease);}
  .swatch:hover{transform:scale(1.08);}
  .swatch.active{border-color:var(--olive);}

  .sizes{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:20px;}
  .size-btn{padding:9px 18px;border-radius:100px;border:1px solid var(--line);font-size:13px;background:var(--white);transition:all .25s var(--ease);}
  .size-btn.active{background:var(--olive);color:#fff;border-color:var(--olive);}
  .size-btn.disabled{opacity:.4;text-decoration:line-through;cursor:not-allowed;}

  .buy-row{display:flex;gap:12px;align-items:center;margin-bottom:14px;}
  .qty{display:flex;align-items:center;gap:14px;border:1px solid var(--line);border-radius:100px;padding:9px 16px;background:var(--white);}
  .qty button{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--brown);transition:all .2s;}
  .qty button:hover{background:var(--cream);color:var(--clay);}
  .qty span{min-width:18px;text-align:center;font-weight:600;font-size:14px;}
  .add-bag{flex:1;background:var(--clay);
    border:none;color:#fff;padding:15px;border-radius:100px;font-size:15px;font-weight:600;
    box-shadow:0 10px 26px -10px rgba(201,127,104,.7);
    transition:background .25s var(--ease), transform .3s var(--ease);}
  .add-bag:hover{background:var(--clay-dark);transform:translateY(-2px);}
  .add-bag.added{background:var(--olive);}
  .wish-big{width:52px;height:52px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .wish-big .icon{width:20px;height:20px;stroke:var(--ink);transition:all .25s var(--ease);}
  .wish-big.active .icon{fill:var(--clay);stroke:var(--clay);}

  /* ---- trust strip ---- */
  .trust{display:flex;flex-direction:column;gap:9px;margin:18px 0 4px;}
  .trust-row{display:flex;align-items:flex-start;gap:10px;font-size:13.5px;}
  .trust-row .icon{width:17px;height:17px;stroke:var(--olive);flex-shrink:0;margin-top:3px;}
  .trust-row b{font-weight:600;}
  .trust-row .sub{color:var(--brown);font-size:12.5px;}
  .pill-ok{color:var(--ok);font-weight:600;}
  .pill-no{color:var(--clay);font-weight:600;}

  /* ---- accordion ---- */
  .accordion{margin-top:8px;}
  .acc-item{border-bottom:1px solid var(--line);}
  .acc-head{width:100%;display:flex;justify-content:space-between;align-items:center;padding:15px 2px;font-size:14.5px;font-weight:600;text-align:start;}
  .acc-head .chev{transition:transform .3s var(--ease);color:var(--brown);}
  .acc-item.open .chev{transform:rotate(180deg);}
  .acc-body{display:none;padding:0 2px 16px;font-size:13.5px;color:#4a4a42;}
  .acc-item.open .acc-body{display:block;}
  .spec-row{display:flex;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px dashed var(--line);}
  .spec-row:last-child{border-bottom:none;}
  .spec-row .k{color:var(--brown);}
  .spec-row .v{font-weight:600;text-align:end;}
  .acc-body ul{padding-inline-start:18px;}
  .acc-body li{margin-bottom:5px;}

  /* ---- related ---- */
  .related{max-width:1240px;margin:0 auto;padding:10px 24px 90px;}
  .related h2{font-size:26px;margin-bottom:20px;}
  .grid{display:grid;grid-template-columns:repeat(4,1fr);gap:20px;}
  .card{background:var(--white);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;cursor:pointer;transition:box-shadow .3s var(--ease);}
  .card:hover{box-shadow:0 22px 40px -22px rgba(25,28,27,.28);}
  .card-media{aspect-ratio:1/1;background:var(--cream);display:flex;align-items:center;justify-content:center;overflow:hidden;}
  .card-photo{width:100%;height:100%;object-fit:cover;display:block;}
  .icon-badge{width:86px;height:86px;border-radius:50%;display:flex;align-items:center;justify-content:center;}
  .icon-badge .icon{width:42%;height:42%;stroke:var(--ink);stroke-width:1.3;opacity:.82;}
  .card-info{padding:13px 14px 15px;display:flex;flex-direction:column;gap:4px;flex:1;}
  .card-info .c{font-size:11.5px;color:var(--brown);}
  .card-info .n{font-weight:600;font-size:14px;}
  .card-info .p{font-weight:700;font-size:14.5px;margin-top:auto;padding-top:8px;}

  /* ---- sticky mobile bar ---- */
  .sticky-bar{display:none;}
  @media(max-width:900px){
    .pdp{grid-template-columns:1fr;gap:28px;padding-top:14px;}
    .gallery{position:static;}
    .info h1{font-size:27px;}
    .grid{grid-template-columns:repeat(2,1fr);}
    body{padding-bottom:78px;}
    .sticky-bar{
      display:flex;position:fixed;bottom:0;left:0;right:0;z-index:60;gap:10px;align-items:center;
      background:rgba(255,255,255,.92);backdrop-filter:blur(14px);
      border-top:1px solid var(--line);padding:11px 16px calc(11px + env(safe-area-inset-bottom));
    }
    .sticky-bar .sp{font-weight:700;font-size:15px;white-space:nowrap;}
    .sticky-bar .add-bag{padding:13px;font-size:14px;}
  }

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--ink);color:#fff;padding:11px 22px;border-radius:100px;font-size:13px;opacity:0;transition:all .3s var(--ease);z-index:100;pointer-events:none;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  @media(max-width:900px){.toast{bottom:88px;}}

  footer{background:transparent;border-top:1px solid rgba(0,0,0,.07);padding:26px 24px;text-align:center;color:var(--brown);font-size:12.5px;font-weight:300;}
</style>
</head>

<header>
  <div class="nav-wrap">
    <a href="index.html" aria-label="Litli — home">
      <svg class="brand-mark" viewBox="0 0 1000 405">
        <path fill="#191C1B" d="M76 32H126V292C126 328 138 343 166 343C178 343 188 341 198 338L202 365C188 369 175 371 159 371C103 371 76 344 76 296Z"/>

        <path fill="#191C1B" d="M476 32H526V292C526 328 538 343 566 343C578 343 588 341 598 338L602 365C588 369 575 371 559 371C503 371 476 344 476 296Z"/>
        <rect x="438" y="170" width="126" height="7" rx="3.5" fill="#191C1B"/>

</header>

<div class="breadcrumb">

</div>

      <span class="stage-tag" id="stageTag" style="display:none"></span>
      <div class="stage-frame" id="stageFrame"><svg class="icon"><use href="#i-pump" id="stageIcon"/></svg></div>
      <span class="shot-note glass" data-i18n="shot.note">صور تجريبية — بانتظار التصوير الفعلي</span>

    <div class="thumbs" id="thumbs"></div>
  </div>

  <!-- INFO -->
  <div class="info">
    <div class="cat" id="pCat">—</div>
    <h1 id="pName">—</h1>

    <div class="rating">
      <div class="stars" id="pStars"></div>
      <span id="pRatingTxt"></span>
    </div>

    <div class="price-block">
      <span class="price-now" id="pPrice">—</span>
      <span class="price-old" id="pOld" style="display:none"></span>
      <span class="save-chip" id="pSave" style="display:none"></span>
    </div>
    <div class="vat-note" data-i18n="vat">السعر شامل ضريبة القيمة المضافة</div>

    <div class="divider"></div>

    <!-- variants -->
    <div id="colorBlock">
      <div class="opt-label"><span data-i18n="opt.color">اللون</span><span class="val" id="colorVal"></span></div>
      <div class="swatches" id="swatches"></div>

    <div id="sizeBlock">

      </div>

      <div class="trust-row">
        <svg class="icon"><use href="#i-truck"/></svg>

<script>
/* ================= i18n ================= */
const dict = {
  ar:{

};
const shotsFor = p => photos[p.id] || null;

/* ================= state ================= */
let P = null, qty = 1, colorIdx = 0, sizeIdx = 0, shotIdx = 0;
let cart = [], wishlist = [];

function getId(){
  const p = new URLSearchParams(location.search).get('id');
  return p ? parseInt(p,10) : 1;
}
const money = n => lang==='ar' ? `${n} ر.س` : `SAR ${n}`;

/* ================= storage ================= */
async function loadState(){
  try{ const r = await window.storage.get('litli-cart'); cart = r ? JSON.parse(r.value) : []; }catch(e){ cart=[]; }
  try{ const r = await window.storage.get('litli-wishlist'); wishlist = r ? JSON.parse(r.value) : []; }catch(e){ wishlist=[]; }
  badges();
  wishUI();
}
async function saveCart(){ try{ await window.storage.set('litli-cart', JSON.stringify(cart)); }catch(e){} }
async function saveWish(){ try{ await window.storage.set('litli-wishlist', JSON.stringify(wishlist)); }catch(e){} }

function badges(){
  const c = cart.reduce((s,i)=>s+i.qty,0);
  const cb = document.getElementById('cartBadge');
  cb.textContent = c; cb.style.display = c>0?'flex':'none';
  const wb = document.getElementById('wishBadge');
  wb.textContent = wishlist.length; wb.style.display = wishlist.length>0?'flex':'none';
}

/* ================= render ================= */
function render(){
  P = products.find(p=>p.id===getId()) || products[0];

  // breadcrumb
  document.getElementById('crumbCat').textContent = catNames[P.need][lang];
  document.getElementById('crumbCat').href = `shop.html?cat=${P.need}`;
  document.getElementById('crumbName').textContent = P[lang];

  // gallery
  const pics = shotsFor(P);
  const frame = document.getElementById('stageFrame');
  const tag = document.getElementById('stageTag');
  if(P.tag){ tag.style.display='block'; tag.textContent = P.tag[lang]; } else tag.style.display='none';

  if(pics){
    if(shotIdx >= pics.length) shotIdx = 0;
    frame.classList.add('has-photo');
    frame.style.removeProperty('--shot');
    frame.innerHTML = `<img src="${pics[shotIdx]}" alt="${P[lang]}">`;
    document.getElementById('thumbs').innerHTML = pics.map((src,i)=>`
      <div class="thumb has-photo ${i===shotIdx?'active':''}" onclick="pickShot(${i})">
        <img src="${src}" alt="">
      </div>`).join('');
    document.querySelector('.shot-note').style.display = 'none';
  } else {
    frame.classList.remove('has-photo');
    frame.innerHTML = `<svg class="icon"><use href="#${P.icon}"/></svg>`;
    frame.style.setProperty('--shot', shots[shotIdx % shots.length]);
    document.getElementById('thumbs').innerHTML = shots.map((s,i)=>`
      <div class="thumb ${i===shotIdx?'active':''}" style="--shot:${s}" onclick="pickShot(${i})">
        <svg class="icon"><use href="#${P.icon}"/></svg>
      </div>`).join('');
    document.querySelector('.shot-note').style.display = 'block';
  }

  // info
  document.getElementById('pCat').textContent = catNames[P.need][lang];
  document.getElementById('pName').textContent = P[lang];
  document.title = `Litli | ${P[lang]}`;

  // stars
  const full = Math.round(P.rating);
  document.getElementById('pStars').innerHTML =
    Array.from({length:5},(_,i)=>`<svg class="icon ${i<full?'':'empty'}"><use href="#i-star"/></svg>`).join('');
  document.getElementById('pRatingTxt').textContent = `${P.rating} ${t('sep')} ${P.reviews} ${t('reviews')}`;

  // price
  document.getElementById('pPrice').textContent = money(P.price);
  document.getElementById('stickyPrice').textContent = money(P.price);
  const oldEl = document.getElementById('pOld'), saveEl = document.getElementById('pSave');
  if(P.old){
    oldEl.style.display='inline'; oldEl.textContent = money(P.old);
    const pct = Math.round((1 - P.price/P.old)*100);
    saveEl.style.display='inline'; saveEl.textContent = lang==='ar' ? `وفّري ${pct}٪` : `Save ${pct}%`;
  } else { oldEl.style.display='none'; saveEl.style.display='none'; }

  // colors
  document.getElementById('colorVal').textContent = P.colors[colorIdx][lang];
  document.getElementById('swatches').innerHTML = P.colors.map((c,i)=>
    `<span class="swatch ${i===colorIdx?'active':''}" style="background:${c.h}" onclick="pickColor(${i})" title="${c[lang]}"></span>`).join('');

  // sizes
  const sizeBlock = document.getElementById('sizeBlock');
  if(P.sizes.length > 1){
    sizeBlock.style.display='block';
    document.getElementById('sizeVal').textContent = P.sizes[sizeIdx][lang];
    document.getElementById('sizes').innerHTML = P.sizes.map((s,i)=>
      `<button class="size-btn ${i===sizeIdx?'active':''} ${s.soon?'disabled':''}" ${s.soon?'disabled':''} onclick="pickSize(${i})">${s[lang]}</button>`).join('');
  } else sizeBlock.style.display='none';

  document.getElementById('qtyVal').textContent = qty;

  // trust
  document.getElementById('deliveryVal').textContent = ' ' + P.delivery[lang];
  document.getElementById('shipNote').textContent = P.multiParcel ? t('ship.multi') : '';
  document.getElementById('returnVal').innerHTML = P.returnable
    ? `<span class="pill-ok">${t('return.yes')}</span>` : `<span class="pill-no">${t('return.no')}</span>`;
  document.getElementById('safetyVal').textContent = ' ' + P.safety[lang];

  // accordion
  const specRows = P.specs.map(s=>`<div class="spec-row"><span class="k">${t(s.k)}</span><span class="v">${s[lang]}</span></div>`).join('')
    + `<div class="spec-row"><span class="k">${t('spec.brand')}</span><span class="v">${P.brand}</span></div>`
    + `<div class="spec-row"><span class="k">${t('spec.sku')}</span><span class="v">${P.sku}</span></div>`;

  const items = [
    {k:'acc.desc', body:`<p>${P.desc[lang]}</p>`, open:true},
    {k:'acc.why',  body:`<ul>${P.why[lang].map(x=>`<li>${x}</li>`).join('')}</ul>`},
    {k:'acc.specs',body:specRows},
    {k:'acc.box',  body:`<ul>${P.box[lang].map(x=>`<li>${x}</li>`).join('')}</ul>`},
    {k:'acc.care', body:`<p>${P.care[lang]}</p>`},
    {k:'acc.ship', body:`<p>${P.delivery[lang]}${P.multiParcel? ' — '+t('ship.multi'):''}</p><p style="margin-top:8px">${P.returnable?t('return.yes'):t('return.no')}</p>`}
  ];
  document.getElementById('accordion').innerHTML = items.map((it,i)=>`
    <div class="acc-item ${it.open?'open':''}">
      <button class="acc-head" onclick="this.parentElement.classList.toggle('open')">
        ${t(it.k)}<svg class="icon chev"><use href="#i-chev"/></svg>
      </button>
      <div class="acc-body">${it.body}</div>
    </div>`).join('');

  // related
  const rel = products.filter(x=>x.id!==P.id).slice(0,4);
  document.getElementById('relatedGrid').innerHTML = rel.map(r=>`
    <div class="card" onclick="location.href='product.html?id=${r.id}'">
      <div class="card-media">${ shotsFor(r)
        ? `<img class="card-photo" src="${shotsFor(r)[0]}" alt="${r[lang]}">`
        : `<div class="icon-badge glass"><svg class="icon"><use href="#${r.icon}"/></svg></div>` }</div>
      <div class="card-info">
        <span class="c">${catNames[r.need][lang]}</span>
        <span class="n">${r[lang]}</span>
        <span class="p">${money(r.price)}</span>
      </div>
    </div>`).join('');

  wishUI();
}

function pickShot(i){ shotIdx=i; render(); }
function pickColor(i){ colorIdx=i; if(!shotsFor(P)) shotIdx = i % shots.length; render(); }
function pickSize(i){ sizeIdx=i; render(); }
function changeQty(d){ qty = Math.max(1, qty+d); document.getElementById('qtyVal').textContent = qty; }

function addToBag(btn){
  const key = `${P.id}-${colorIdx}-${sizeIdx}`;
  const ex = cart.find(i=>i.key===key);
  if(ex) ex.qty += qty;
  else cart.push({key, id:P.id, ar:P.ar, en:P.en, icon:P.icon, price:P.price, qty});
  saveCart(); badges();
  toast(t('toast.add'));
  const orig = btn.textContent;
  btn.textContent = t('btn.added'); btn.classList.add('added');
  setTimeout(()=>{ btn.textContent = t('btn.add'); btn.classList.remove('added'); }, 1200);
}

function toggleWish(){
  const i = wishlist.indexOf(P.id);
  if(i>-1){ wishlist.splice(i,1); toast(t('toast.wish.rm')); }
  else { wishlist.push(P.id); toast(t('toast.wish.add')); }
  saveWish(); badges(); wishUI();
}
function wishUI(){
  if(!P) return;
  document.getElementById('wishBtn').classList.toggle('active', wishlist.includes(P.id));
}

function toast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg; el.classList.add('show');
  setTimeout(()=>el.classList.remove('show'), 1900);
}

/* ================= language ================= */
function applyLang(l){
  lang = l;
  const root = document.getElementById('htmlRoot');
  root.lang = l; root.dir = l==='ar' ? 'rtl' : 'ltr';
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k = el.getAttribute('data-i18n');
    if(dict[l][k]!==undefined) el.textContent = dict[l][k];
  });
  document.querySelectorAll('[data-lang-opt]').forEach(el=>{
    el.classList.toggle('active', el.getAttribute('data-lang-opt')===l);
  });
  render();
}
document.getElementById('langSwitch').addEventListener('click', ()=> applyLang(lang==='ar'?'en':'ar'));
document.getElementById('wishNav').addEventListener('click', ()=> location.href='index.html');

/* init */
render();
loadState();
</script>
</body>
</html>
